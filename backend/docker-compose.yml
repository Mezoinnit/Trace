services:
  postgres:
    image: postgres:16-alpine
    container_name: trace-postgres
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
    ports:
      - "5432:5432"
    volumes:
      - trace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Scheduled database backups (DEPLOYMENT.md §7, Phase 14): runs the same
  # pg_dump/verify/prune logic as backend/scripts/backup.sh against the
  # postgres service. Override TRACE_BACKUP_DIR / TRACE_BACKUP_RETENTION to
  # point the volume at durable storage.
  pg_backup:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: trace
      PGPASSWORD: trace
      PGDATABASE: trace
      TRACE_BACKUP_DIR: /backups
      TRACE_BACKUP_RETENTION: "14"
    volumes:
      - trace_backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/backup.sh"]
    restart: unless-stopped

volumes:
  trace_pgdata:
  trace_backups: