services:
  postgres:
    image: postgres:16-alpine
    container_name: trace-postgres
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
    ports:
      - "5432:5432"
    volumes:
      - trace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trace_pgdata: