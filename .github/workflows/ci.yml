name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build, tests, and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trace
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/trace
          DATABASE_USER: trace
          DATABASE_PASSWORD: trace
        run: ./gradlew build

      - name: Static analysis (detekt)
        working-directory: backend
        run: ./gradlew detekt

      - name: Verify migrations on CI database
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/trace
          DATABASE_USER: trace
          DATABASE_PASSWORD: trace
        run: ./gradlew :server:worker:run --args="--migrate-only"

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble and run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest